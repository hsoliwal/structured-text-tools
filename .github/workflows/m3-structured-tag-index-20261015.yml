# SPDX-License-Identifier: CC-BY-4.0
name: M3 Structured Text Tag Index

on:
  pull_request:
    paths:
      - 'render-template.py'
      - 'tests/test_tag_index.py'
      - '.github/workflows/m3-structured-tag-index-20261015.yml'
      - 'data/*.toml'
      - 'README.md.jinja'
      - 'sql-based.md.jinja'
      - 'macros.md.jinja'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-order-and-output-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify indexed tag lookup and original Jinja byte parity
        run: |
          uv run --python 3.11 --with 'click==8.*' --with 'jinja2==3.*' --with 'tomli==2.*' \
            python -m unittest discover -s tests -v
      - name: Regenerate the two derived Markdown files without direct editing
        run: |
          make -B README.md sql-based.md
          git diff --check
          git diff --exit-code -- README.md sql-based.md
